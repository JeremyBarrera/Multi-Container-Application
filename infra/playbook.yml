---
- name: Set up Docker and deploy app
  hosts: webserver
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Add vagrant user to docker group
      user:
        name: vagrant
        groups: docker
        append: yes

    - name: Install git
      apt:
        name: git
        state: present

    - name: Clone the app repository
      git:
        repo: "https://github.com/JeremyBarrera/Multi-Container-Application.git"
        dest: /home/vagrant/app
        version: main
        force: yes

    - name: Start the app with Docker Compose
      command: docker compose up -d --build
      args:
        chdir: /home/vagrant/app
